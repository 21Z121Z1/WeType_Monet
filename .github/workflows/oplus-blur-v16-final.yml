name: Build Oplus Blur V16 Final

on:
  push:
    branches:
      - experiment/oplus-private-blur-v16
    paths:
      - ".github/workflows/oplus-blur-v16-final.yml"
      - "scripts/oplus_visual_v16.py"
      - "scripts/oplus_visual_v16_final.py"
      - "scripts/build_oplus_blur_test.py"
      - "scripts/build_oplus_blur_v16_final_test.py"
      - "tests/test_oplus_visual_v16.py"
      - "config/**"
      - "overlay/**"
      - "signing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wetype-oplus-private-blur-v16-final
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Validate V16 final wrapper
        run: |
          python -m unittest discover -s tests -p 'test_oplus_visual_v16.py' -v
          python -m py_compile scripts/oplus_visual_v16.py scripts/oplus_visual_v16_final.py scripts/build_oplus_blur_v16_final_test.py

      - name: Install APK rebuild and signing tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner
          APKTOOL_VER="2.9.3"
          APKTOOL_COMMIT="3bb7888eb47103a1ba13c86b8a90a4d9614c9e7c"
          APKTOOL_SCRIPT_SHA256="2e18434d91810bef9cd562bb486246eaec08ac368f0d810214a57b6c3a967ae7"
          APKTOOL_JAR_SHA256="7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/iBotPeaches/Apktool/${APKTOOL_COMMIT}/scripts/linux/apktool" \
            --output /tmp/apktool
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" \
            --output /tmp/apktool.jar
          echo "${APKTOOL_SCRIPT_SHA256}  /tmp/apktool" | sha256sum --check --status
          echo "${APKTOOL_JAR_SHA256}  /tmp/apktool.jar" | sha256sum --check --status
          sudo install -m 0755 /tmp/apktool /usr/local/bin/apktool
          sudo install -m 0644 /tmp/apktool.jar /usr/local/bin/apktool.jar
          BCPROV_VER="1.78.1"
          BCPROV_SHA256="add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/${BCPROV_VER}/bcprov-jdk18on-${BCPROV_VER}.jar" \
            --output /tmp/bcprov.jar
          echo "${BCPROV_SHA256}  /tmp/bcprov.jar" | sha256sum --check --status
          echo "BCPROV_JAR_PATH=/tmp/bcprov.jar" >> "$GITHUB_ENV"

      - name: Build V16 final APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: python scripts/build_oplus_blur_v16_final_test.py

      - name: Verify APK and repository certificate
        run: |
          set -euo pipefail
          APK="$(find out -maxdepth 1 -type f -name 'Wetype_Monet_OplusBlurV16_*.apk' -print -quit)"
          test -n "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee out/oplus-blur-v16-certificate.txt
          sha256sum "$APK" | tee out/oplus-blur-v16-apk.sha256

      - name: Upload V16 final APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wetype-oplus-private-blur-v16-final
          if-no-files-found: error
          path: |
            out/Wetype_Monet_OplusBlurV16_*.apk
            out/oplus-blur-v16-build-metadata.json
            out/oplus-blur-v16-certificate.txt
            out/oplus-blur-v16-apk.sha256
