name: Build Oplus Private Blur Test

on:
  push:
    branches:
      - experiment/oplus-private-blur
    paths:
      - ".github/workflows/oplus-blur-test.yml"
      - "scripts/build.py"
      - "scripts/build_oplus_blur_test.py"
      - "scripts/oplus_blur.py"
      - "scripts/oplus_blur_attach_fix.py"
      - "scripts/oplus_blur_v2.py"
      - "scripts/oplus_blur_v3.py"
      - "scripts/oplus_blur_v4.py"
      - "scripts/oplus_visual_v5.py"
      - "tests/test_oplus_blur*.py"
      - "tests/test_oplus_visual_v5.py"
      - "config/**"
      - "overlay/**"
      - "signing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wetype-oplus-private-blur-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run baseline mapping tests
        run: |
          python - <<'PY'
          import sys
          import unittest
          from pathlib import Path

          sys.path.insert(0, str(Path("tests").resolve()))
          import test_build

          test_build.build.REPOSITORY_SLUG = "0x1e93d/WeType_Monet"
          test_build.build.UPDATE_JSON_URL = "https://raw.githubusercontent.com/0x1e93d/WeType_Monet/main/wetype_monet.json"
          test_build.build.KSU_CHANGELOG_URL = "https://raw.githubusercontent.com/0x1e93d/WeType_Monet/main/CHANGELOG.md"
          suite = unittest.defaultTestLoader.loadTestsFromModule(test_build)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Run Oplus blur patch tests
        run: python -m unittest discover -s tests -p 'test_oplus_blur*.py' -v
      - name: Run ColorOS G2/system-font tests
        run: python -m unittest discover -s tests -p 'test_oplus_visual_v5.py' -v
      - name: Check experimental scripts syntax
        run: >-
          python -m py_compile
          scripts/oplus_blur.py
          scripts/oplus_blur_attach_fix.py
          scripts/oplus_blur_v2.py
          scripts/oplus_blur_v3.py
          scripts/oplus_blur_v4.py
          scripts/oplus_visual_v5.py
          scripts/build_oplus_blur_test.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install APK rebuild/signing tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner
          APKTOOL_VER="2.9.3"
          APKTOOL_COMMIT="3bb7888eb47103a1ba13c86b8a90a4d9614c9e7c"
          APKTOOL_SCRIPT_SHA256="2e18434d91810bef9cd562bb486246eaec08ac368f0d810214a57b6c3a967ae7"
          APKTOOL_JAR_SHA256="7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/iBotPeaches/Apktool/${APKTOOL_COMMIT}/scripts/linux/apktool" \
            --output /tmp/apktool
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" \
            --output /tmp/apktool.jar
          echo "${APKTOOL_SCRIPT_SHA256}  /tmp/apktool" | sha256sum --check --status
          echo "${APKTOOL_JAR_SHA256}  /tmp/apktool.jar" | sha256sum --check --status
          sudo install -m 0755 /tmp/apktool /usr/local/bin/apktool
          sudo install -m 0644 /tmp/apktool.jar /usr/local/bin/apktool.jar

          BCPROV_VER="1.78.1"
          BCPROV_SHA256="add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/${BCPROV_VER}/bcprov-jdk18on-${BCPROV_VER}.jar" \
            --output /tmp/bcprov.jar
          echo "${BCPROV_SHA256}  /tmp/bcprov.jar" | sha256sum --check --status
          echo "BCPROV_JAR_PATH=/tmp/bcprov.jar" >> "$GITHUB_ENV"

      - name: Build ColorOS keyboard-material v5 APK with repository release signature
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: python scripts/build_oplus_blur_test.py

      - name: Verify output APK and certificate
        run: |
          set -euo pipefail
          APK="$(find out -maxdepth 1 -type f -name 'Wetype_Monet_OplusBlurV5_*.apk' -print -quit)"
          test -n "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee out/oplus-blur-v5-certificate.txt
          sha256sum "$APK" | tee out/oplus-blur-v5-apk.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wetype-oplus-private-blur-v5-test
          if-no-files-found: error
          path: |
            out/Wetype_Monet_OplusBlurV5_*.apk
            out/oplus-blur-v5-build-metadata.json
            out/oplus-blur-v5-certificate.txt
            out/oplus-blur-v5-apk.sha256
