name: Analyze WeType Tool Hook Surfaces

on:
  push:
    branches:
      - experiment/oplus-private-blur
    paths:
      - ".github/workflows/analyze-wetype-tool.yml"
      - "scripts/analyze_wetype_tool_release.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wetype-tool-static-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install apktool
        run: |
          set -euo pipefail
          APKTOOL_VER="2.9.3"
          APKTOOL_COMMIT="3bb7888eb47103a1ba13c86b8a90a4d9614c9e7c"
          APKTOOL_SCRIPT_SHA256="2e18434d91810bef9cd562bb486246eaec08ac368f0d810214a57b6c3a967ae7"
          APKTOOL_JAR_SHA256="7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/iBotPeaches/Apktool/${APKTOOL_COMMIT}/scripts/linux/apktool" \
            --output /tmp/apktool
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" \
            --output /tmp/apktool.jar
          echo "${APKTOOL_SCRIPT_SHA256}  /tmp/apktool" | sha256sum --check --status
          echo "${APKTOOL_JAR_SHA256}  /tmp/apktool.jar" | sha256sum --check --status
          sudo install -m 0755 /tmp/apktool /usr/local/bin/apktool
          sudo install -m 0644 /tmp/apktool.jar /usr/local/bin/apktool.jar

      - name: Download WeType Tool v1.3.2 API102 release
        run: |
          set -euo pipefail
          mkdir -p analysis
          URL="https://github.com/0x1e93d/WeType-Tool-Releases/releases/download/tool-v1.3.2/WeType-Tool-v1.3.2-api102.apk"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$URL" --output analysis/wetype-tool.apk
          echo "9893b3416ce6ca20221d2afe49a166318c7e2c5b123dc709b14264c6b3f57eff  analysis/wetype-tool.apk" | sha256sum --check

      - name: Decode module smali only
        run: apktool d -f -r analysis/wetype-tool.apk -o analysis/wetype-tool-decoded

      - name: Map hook surfaces
        run: |
          python scripts/analyze_wetype_tool_release.py analysis/wetype-tool-decoded \
            --json analysis/wetype-tool-hook-report.json \
            --text analysis/wetype-tool-hook-report.txt
          python -m py_compile scripts/analyze_wetype_tool_release.py

      - name: Preserve focused hook implementation smali
        run: |
          set -euo pipefail
          mkdir -p analysis/wetype-tool-focus
          PATTERN='keyboardBlurInitMethod|keyboardBlurRootViewField|keyPressBubbleConfigConstructor|keyPressBubbleCornerField|keyRuntimeStyleBinder|keyRuntimeCornerSetter|keyRuntimeShadowSetter|toolbarInvokeMethod|toolbarFunctionField|toolbarCategoryField|candidateBackgroundColorGetter|candidateBackgroundCornerSetter|candidateHolderBindMethod|candidateHolderItemRootGetter|floatingKeyboardRootAccessorMethod|floatingKeyboardContentAccessorMethod|floatingKeyboardModelStateMethod|wetype_keyboard_background_blur_|keyboard_blur_tree|toolbar_background_hook|wetype_floating_keyboard_blur_|WeTypeBlurCarrier_Float|WeTypeBlurHighlight_Float|ime_skin_clipboard_item_bg_color|ime_emoji_keyboard_gradient_bg_color|pressBubble|PressBubble|FloatingBlurSymbols|KeyboardBlurSymbols|CandidateStyleSymbols|ToolbarFields|com\.tencent\.wetype\.plugin\.hld\.keyboard\.S[0-9]+|ImeEmojiShowBoardView|ImeCandidateView|S10SettingCustomToolbarView'
          while IFS= read -r file; do
            rel="${file#analysis/wetype-tool-decoded/}"
            mkdir -p "analysis/wetype-tool-focus/$(dirname "$rel")"
            cp "$file" "analysis/wetype-tool-focus/$rel"
          done < <(grep -R -l -E "$PATTERN" analysis/wetype-tool-decoded/smali* --include='*.smali' | sort -u)
          find analysis/wetype-tool-focus -type f -name '*.smali' | sort > analysis/wetype-tool-focus-files.txt
          test -s analysis/wetype-tool-focus-files.txt
          echo "focused smali files: $(wc -l < analysis/wetype-tool-focus-files.txt)"

      - name: Preserve release metadata and class list
        run: |
          set -euo pipefail
          find analysis/wetype-tool-decoded -path '*/smali*/*.smali' -type f \
            | sed 's#analysis/wetype-tool-decoded/##' \
            | sort > analysis/wetype-tool-smali-files.txt
          unzip -p analysis/wetype-tool.apk AndroidManifest.xml > /dev/null || true
          sha256sum analysis/wetype-tool.apk > analysis/wetype-tool-apk.sha256

      - name: Upload analysis report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wetype-tool-v1.3.2-hook-analysis
          if-no-files-found: error
          path: |
            analysis/wetype-tool-hook-report.json
            analysis/wetype-tool-hook-report.txt
            analysis/wetype-tool-smali-files.txt
            analysis/wetype-tool-focus-files.txt
            analysis/wetype-tool-focus/**
            analysis/wetype-tool-apk.sha256
